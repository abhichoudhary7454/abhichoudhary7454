<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#17202a
}
.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
.box{
  background:white;
  width:100%;
  max-width:400px;
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 30px #0001
}
h1{margin-top:0}
input,select,button{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px
}
button{
  background:#111827;
  color:white;
  border:0;
  cursor:pointer
}
.error{color:#d00;margin-top:10px}
.dashboard{display:none}
header{
  background:#111827;
  color:white;
  padding:18px
}
.wrap{
  max-width:1100px;
  margin:auto;
  padding:20px
}
.card{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 3px 15px #0000000d
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px
}
table{
  width:100%;
  border-collapse:collapse
}
th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:left
}
.actions button{
  width:auto;
  padding:7px 12px;
  margin-right:5px
}
.logout{background:#dc2626}
.small{color:#666;font-size:13px}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginPage">
  <div class="box">
    <h1>Admin Login</h1>
    <p class="small">SattaKingResultsLive Admin</p>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div class="error" id="error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

<header>
  <div class="wrap">
    <strong>Admin Dashboard</strong>
  </div>
</header>

<div class="wrap">

  <div class="card">
    <h2>Add / Update Record</h2>

    <div class="grid">
      <input id="date" type="date">
      <input id="game" placeholder="Game name">
      <input id="opening" placeholder="Opening">
      <input id="closing" placeholder="Closing">

      <select id="status">
        <option value="Pending">Pending</option>
        <option value="Updated">Updated</option>
      </select>
    </div>

    <button onclick="saveRecord()">Save Record</button>
    <button onclick="clearForm()">Clear</button>
  </div>

  <div class="card">
    <h2>Records</h2>

    <div style="overflow:auto">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Game</th>
            <th>Opening</th>
            <th>Closing</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="records"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <button class="logout" onclick="logout()">Logout</button>
  </div>

</div>
</div>

<script>

let editIndex = -1;

/*
  DEMO LOGIN
  Username: admin
  Password: admin123

  Production website ke liye server-side authentication
  aur database zaroor use karein.
*/

function login(){

  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  if(user === "admin" && pass === "admin123"){

    localStorage.setItem("adminLogin","yes");

    document.getElementById("loginPage").style.display="none";
    document.getElementById("dashboard").style.display="block";

    loadRecords();

  }else{

    document.getElementById("error").textContent =
      "Wrong username or password";

  }
}

function logout(){

  localStorage.removeItem("adminLogin");

  document.getElementById("dashboard").style.display="none";
  document.getElementById("loginPage").style.display="flex";

}

function getRecords(){

  return JSON.parse(localStorage.getItem("siteRecords") || "[]");

}

function saveRecords(data){

  localStorage.setItem("siteRecords",JSON.stringify(data));

}

function saveRecord(){

  const date =
    document.getElementById("date").value;

  const game =
    document.getElementById("game").value.trim();

  const opening =
    document.getElementById("opening").value.trim();

  const closing =
    document.getElementById("closing").value.trim();

  const status =
    document.getElementById("status").value;

  if(!date || !game){

    alert("Date and Game name required");
    return;

  }

  const data = getRecords();

  const record = {
    date,
    game,
    opening,
    closing,
    status
  };

  if(editIndex === -1){

    data.push(record);

  }else{

    data[editIndex] = record;
    editIndex = -1;

  }

  saveRecords(data);
  clearForm();
  loadRecords();

}

function loadRecords(){

  const data = getRecords();

  const tbody =
    document.getElementById("records");

  tbody.innerHTML="";

  if(data.length === 0){

    tbody.innerHTML =
      '<tr><td colspan="6">No records added yet.</td></tr>';

    return;

  }

  data.forEach((r,i)=>{

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${escapeHtml(r.date)}</td>
      <td>${escapeHtml(r.game)}</td>
      <td>${escapeHtml(r.opening || "--")}</td>
      <td>${escapeHtml(r.closing || "--")}</td>
      <td>${escapeHtml(r.status)}</td>
      <td class="actions">
        <button onclick="editRecord(${i})">Edit</button>
        <button onclick="deleteRecord(${i})">Delete</button>
      </td>
    `;

    tbody.appendChild(tr);

  });

}
