<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:380px;
  background:#fff;
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.login-box h1{
  text-align:center;
  margin:0 0 8px;
}

.login-box p{
  text-align:center;
  color:#6b7280;
  margin-bottom:25px;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:15px;
}

button{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  background:#111827;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.login-btn{
  width:100%;
  margin-top:10px;
}

.error{
  display:none;
  color:#dc2626;
  text-align:center;
  margin-top:15px;
}

#dashboard{
  display:none;
}

header{
  background:#111827;
  color:white;
  padding:16px 20px;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logout{
  background:#dc2626;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.card h2{
  margin-top:0;
}

.save{
  width:100%;
  margin-top:10px;
}

.message{
  color:#15803d;
  font-weight:bold;
  margin-top:12px;
}

.table-box{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:700px;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
}

th{
  background:#f9fafb;
}

.edit{
  background:#2563eb;
  padding:8px 12px;
}

.delete{
  background:#dc2626;
  padding:8px 12px;
  margin-left:5px;
}

.empty{
  text-align:center;
  color:#6b7280;
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div class="login" id="loginPage">

  <div class="login-box">

    <h1>Admin Login</h1>

    <p>SattaKingResultsLive</p>

    <input
      id="username"
      type="text"
      placeholder="Username"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button
      class="login-btn"
      type="button"
      onclick="login()"
    >
      Login
    </button>

    <div id="error" class="error">
      Wrong username or password
    </div>

  </div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

<header>

  <div class="header">

    <strong>Admin Dashboard</strong>

    <button
      class="logout"
      type="button"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</header>


<div class="container">

  <!-- ADD RECORD -->

  <div class="card">

    <h2>Add / Update Result</h2>

    <input
      id="date"
      type="date"
    >

    <input
      id="game"
      type="text"
      placeholder="Game Name"
    >

    <input
      id="opening"
      type="text"
      placeholder="Opening"
    >

    <input
      id="closing"
      type="text"
      placeholder="Closing"
    >

    <select id="status">

      <option value="Pending">Pending</option>
      <option value="Open">Open</option>
      <option value="Closed">Closed</option>

    </select>

    <button
      class="save"
      type="button"
      onclick="saveRecord()"
    >
      Save Result
    </button>

    <div id="message" class="message"></div>

  </div>


  <!-- RECORDS -->

  <div class="card">

    <h2>All Records</h2>

    <div class="table-box">

      <table>

        <thead>

          <tr>
            <th>Date</th>
            <th>Game</th>
            <th>Opening</th>
            <th>Closing</th>
            <th>Status</th>
            <th>Action</th>
          </tr>

        </thead>

        <tbody id="records">

        </tbody>

      </table>

    </div>

  </div>

</div>

</div>


<script>

/* LOGIN */

function login(){

  var user =
    document.getElementById("username").value.trim();

  var pass =
    document.getElementById("password").value;

  if(user === "admin" && pass === "admin123"){

    localStorage.setItem(
      "adminLogin",
      "true"
    );

    showDashboard();

  }else{

    document.getElementById("error").style.display =
      "block";

  }

}


/* SHOW DASHBOARD */

function showDashboard(){

  document.getElementById("loginPage").style.display =
    "none";

  document.getElementById("dashboard").style.display =
    "block";

  loadRecords();

}


/* LOGOUT */

function logout(){

  localStorage.removeItem("adminLogin");

  location.reload();

}


/* SAVE RECORD */

function saveRecord(){

  var date =
    document.getElementById("date").value;

  var game =
    document.getElementById("game").value.trim();

  var opening =
    document.getElementById("opening").value.trim();

  var closing =
    document.getElementById("closing").value.trim();

  var status =
    document.getElementById("status").value;


  if(!date || !game){

    alert("Please enter Date and Game Name.");

    return;

  }


  var records =
    JSON.parse(
      localStorage.getItem("records") || "[]"
    );


  records.push({

    date:date,
    game:game,
    opening:opening,
    closing:closing,
    status:status

  });


  localStorage.setItem(
    "records",
    JSON.stringify(records)
  );


  document.getElementById("date").value="";
  document.getElementById("game").value="";
  document.getElementById("opening").value="";
  document.getElementById("closing").value="";
  document.getElementById("status").value="Pending";


  document.getElementById("message").innerText =
    "Result saved successfully.";

  loadRecords();

}


/* LOAD RECORDS */

function loadRecords(){

  var records =
    JSON.parse(
      localStorage.getItem("records") || "[]"
    );

  var html="";


  if(records.length === 0){

    html =
      '<tr><td colspan="6" class="empty">No records yet</td></tr>';

  }else{

    records.forEach(function(r,index){

      html +=
      "<tr>" +

      "<td>" + r.date + "</td>" +

      "<td>" + r.game + "</td>" +

      "<td>" + r.opening + "</td>" +

      "<td>" + r.closing + "</td>" +

      "<td>" + r.status + "</td>" +

      "<td>" +

      "<button class='delete' onclick='deleteRecord(" +
      index +
      ")'>Delete</button>" +

      "</td>" +

      "</tr>";

    });

  }


  document.getElementById("records").innerHTML =
    html;

}


/* DELETE */

function deleteRecord(index){

  if(!confirm("Delete this record?")){

    return;

  }


  var records =
    JSON.parse(
      localStorage.getItem("records") || "[]"
    );


  records.splice(index,1);


  localStorage.setItem(
    "records",
    JSON.stringify(records)
  );


  loadRecords();

}


/* AUTO LOGIN */

if(
  localStorage.getItem("adminLogin") === "true"
){

  showDashboard();

}

</script>

</body>
</html>
